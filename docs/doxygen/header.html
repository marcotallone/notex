<script type="text/javascript">
    // Guarded so one extension failing degrades to a console message
    // instead of aborting this whole block (CHANGELOG entry 34).
    function notexInit(name, extension) {
        try {
            if (extension && typeof extension.init === 'function') {
                extension.init();
            } else {
                console.error('NoTeX: ' + name + '.init() unavailable, skipped');
            }
        } catch (error) {
            console.error('NoTeX: ' + name + '.init() threw', error);
        }
    }
    notexInit('DoxygenAwesomeFragmentCopyButton', typeof DoxygenAwesomeFragmentCopyButton !== 'undefined' ? DoxygenAwesomeFragmentCopyButton : null);
    notexInit('DoxygenAwesomeDarkModeToggle', typeof DoxygenAwesomeDarkModeToggle !== 'undefined' ? DoxygenAwesomeDarkModeToggle : null);
    notexInit('DoxygenAwesomeParagraphLink', typeof DoxygenAwesomeParagraphLink !== 'undefined' ? DoxygenAwesomeParagraphLink : null);
    notexInit('DoxygenAwesomeInteractiveToc', typeof DoxygenAwesomeInteractiveToc !== 'undefined' ? DoxygenAwesomeInteractiveToc : null);
    notexInit('DoxygenAwesomeTabs', typeof DoxygenAwesomeTabs !== 'undefined' ? DoxygenAwesomeTabs : null);
</script>
<script type="text/javascript">
    // Deliberately its own <script>: a throw in another block cannot
    // abort this one, which is what silently killed mermaid before.
    (function() {
        if (typeof mermaid === 'undefined') { return; }
        var toggle = typeof DoxygenAwesomeDarkModeToggle !== 'undefined' ? DoxygenAwesomeDarkModeToggle : null;
        var counter = 0;

        // Must run here, before DOMContentLoaded: mermaid's own autorun
        // would otherwise overwrite each diagram's source with its SVG.
        mermaid.initialize({ startOnLoad: false });

        // darkMode is a separate themeVariable; theme 'dark' alone leaves
        // most computed colors on their light-mode branch.
        function config(dark) {
            return dark
                ? { startOnLoad: false, theme: 'dark', themeVariables: { darkMode: true } }
                : { startOnLoad: false, theme: 'neutral' };
        }

        // Source captured once, up front, so every re-render redraws from
        // it rather than from a previous render's own output.
        function saveSource() {
            document.querySelectorAll('.mermaid').forEach(function(el) {
                if (!el.hasAttribute('data-notex-source')) {
                    el.setAttribute('data-notex-source', el.textContent);
                }
            });
        }

        // The third argument matters: without it mermaid measures label
        // text against <body>'s font, so nodes size wrong and text crops.
        function render(dark) {
            mermaid.initialize(config(dark));
            document.querySelectorAll('.mermaid').forEach(function(el) {
                var source = el.getAttribute('data-notex-source');
                if (!source) { return; }
                mermaid.render('notex-mermaid-' + (counter++), source, el).then(function(result) {
                    el.innerHTML = result.svg;
                }).catch(function(error) {
                    // mermaid empties the element first, so restore the
                    // source rather than leave the diagram blank.
                    el.textContent = source;
                    console.error('NoTeX: mermaid render failed', error);
                });
            });
        }

        // userPreference is a getter over localStorage and the system
        // setting, so it reads correctly even if init() never ran.
        function darkNow() {
            return toggle ? toggle.userPreference : false;
        }

        document.addEventListener('DOMContentLoaded', function() {
            saveSource();
            render(darkNow());
        });

        // Every mode-change path dispatches through this one property,
        // so replacing it re-renders on toggle, system change and restore.
        if (toggle) {
            var originalEnableDarkMode = toggle.enableDarkMode;
            toggle.enableDarkMode = function(enable) {
                originalEnableDarkMode(enable);
                render(enable);
            };
        }
    })();
</script>
<script type="text/javascript">
    // Moves the toggle button before the search box; MutationObserver
    // since the extension re-appends it after on every resize.
    document.addEventListener('DOMContentLoaded', function() {
        function moveToggleBeforeSearch() {
            var searchBox = document.getElementById("MSearchBox");
            var toggle = document.querySelector("doxygen-awesome-dark-mode-toggle");
            if (searchBox && toggle && searchBox.previousElementSibling !== toggle) {
                searchBox.parentNode.insertBefore(toggle, searchBox);
            }
        }
        new MutationObserver(moveToggleBeforeSearch).observe(document.body, {childList: true, subtree: true});
        moveToggleBeforeSearch();
    });
</script>
<script type="text/javascript">
    // Publishes the sticky bar's measured height, which CSS cannot read
    // on its own, so anchor targets can offset by it.
    document.addEventListener('DOMContentLoaded', function() {
        var topBar = document.getElementById('top');
        if (!topBar) { return; }
        function publishHeight() {
            document.documentElement.style.setProperty('--notex-topbar-height', topBar.offsetHeight + 'px');
        }
        publishHeight();
        if (typeof ResizeObserver !== 'undefined') {
            new ResizeObserver(publishHeight).observe(topBar);
        }
    });
</script>

<style>
/* Sticky, blurred top bar. Colours mirror the theme's own light/dark
   custom-property pattern so the toggle keeps driving them. */
:root {
    --notex-topbar-background: rgba(255, 255, 255, 0.50);
    --notex-topbar-height: 0px;
}
@media (prefers-color-scheme: dark) {
    html:not(.light-mode) {
        --notex-topbar-background: rgba(28, 29, 31, 0.50);
    }
}
html.dark-mode {
    --notex-topbar-background: rgba(28, 29, 31, 0.50);
}
#top {
    position: sticky;
    top: 0;
    background: var(--notex-topbar-background);
    -webkit-backdrop-filter: saturate(180%) blur(12px);
    backdrop-filter: saturate(180%) blur(12px);
}
/* Without blur support the bar must stay opaque to stay readable. */
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    #top {
        background: var(--header-background);
    }
}
/* Anchor targets would otherwise land underneath the sticky bar. */
a.anchor {
    scroll-margin-top: calc(var(--notex-topbar-height) + var(--spacing-large));
}
/* Space before the search box, now that the toggle sits there. */
doxygen-awesome-dark-mode-toggle {
    margin-right: 0.5em;
}
/* Circular GitHub icon, replacing the theme's corner ribbon. */
#notex-github-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    color: var(--page-secondary-foreground-color, #52606d);
    transition: background-color 0.15s ease, color 0.15s ease;
}
#notex-github-icon:hover {
    background-color: var(--separator-color, rgba(0, 0, 0, 0.08));
    color: var(--page-foreground-color, #14181d);
}
</style>
